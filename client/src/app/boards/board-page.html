<main class="min-h-dvh bg-slate-100 p-6 text-slate-900">
  <h1 class="mb-6 text-3xl font-bold">{{ board().title }}</h1>

  <div class="mb-6 flex gap-2">
    <input
      #newCardTitle
      class="rounded border border-slate-300 px-3 py-2"
      placeholder="New todo card"
      aria-label="New todo card title">
    <button
      type="button"
      class="rounded bg-blue-600 px-4 py-2 font-semibold text-white"
      (click)="addTodoCard(newCardTitle.value); newCardTitle.value = ''">
      Add card
    </button>
  </div>

  <section class="grid gap-4 md:grid-cols-3" aria-label="Board lists">
    @for (list of board().lists; track list.title) {
      <article class="rounded bg-slate-200 p-3">
        <h2 class="mb-3 font-semibold">{{ list.title }}</h2>

        <ul class="grid gap-2">
          @for (card of list.cards; track card.title) {
            <li class="rounded bg-white p-3 shadow-sm">{{ card.title }}</li>
          }
        </ul>
      </article>
    }
  </section>
</main>
